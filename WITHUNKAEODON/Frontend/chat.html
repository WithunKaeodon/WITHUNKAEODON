<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Icon.svg">
<title>กล่องข้อความ - OakStay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="header">
    <a href="index.html" class="logo">
        <img src="Icon.svg" alt="OakStay Logo">
        <span>OakStay</span>
    </a>
    <a href="javascript:history.back()" class="btn-back">⬅️ ย้อนกลับ</a>
</div>

<div class="chat-container">
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">💬 กล่องข้อความ</div>
        <div class="contact-list" id="contactList">
            </div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chatHeader" style="display: none;">
            <button class="btn-menu-mobile" onclick="backToSidebar()">🔙</button>
            <div class="contact-avatar" style="width: 40px; height: 40px; font-size: 16px;">👤</div>
            <span id="chatHeaderName">ชื่อคนคุย</span>
        </div>

        <!-- Banner ที่พักถูกลบออกแล้ว เพราะใช้ Property Card ในแชทแทน -->
        
        <div class="empty-chat" id="emptyChat">
            <span>💬</span>
            เลือกรายชื่อผู้ติดต่อเพื่อเริ่มสนทนา
        </div>

        <div class="chat-messages" id="chatMessages" style="display: none;">
            </div>

        <div class="image-preview-container" id="imagePreviewContainer">
            <img id="imagePreview" src="">
            <button class="btn-cancel-img" onclick="cancelImage()">✕</button>
        </div>

        <div class="chat-input" id="chatInputArea" style="display: none;">
            <label for="imageUploadInput" class="btn-attach" title="ส่งรูปภาพ">📷</label>
            <input type="file" id="imageUploadInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            <button class="btn-attach" id="btnShareProperty" onclick="openSharePropertyPanel()" title="แนบที่พัก" style="display:none;">🏠</button>
            <input type="text" id="messageInput" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()" title="ส่งข้อความ">➤</button>
        </div>

        <!-- Panel เลือกที่พักเพื่อแนบ -->
        <div id="sharePropertyPanel" style="display:none; position:absolute; bottom:70px; left:10px; right:10px; background:white; border:1px solid #dcd3c6; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.12); max-height:280px; overflow-y:auto; z-index:100;">
            <div style="padding:12px 16px; border-bottom:1px solid #f0ece6; font-weight:600; font-size:14px; color:#4a3f35; display:flex; justify-content:space-between;">
                <span>⭐ เลือกที่พักเพื่อขอรีวิว</span>
                <span onclick="document.getElementById('sharePropertyPanel').style.display='none'" style="cursor:pointer; color:#aaa; font-size:18px;">&times;</span>
            </div>
            <div id="sharePropertyList" style="padding:8px;"></div>
        </div>
    </div>

</div>

<script src="js/chat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
