<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Icon.svg">
<title>ตั้งค่าโปรไฟล์ - OakStay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/edit-profile.css">
</style>

<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="shared-header"></div>
<script src="js/shared-header.js"></script>


<div class="container">

    <!-- รูปโปรไฟล์ + ชื่อ + โทร -->
    <div class="card" id="section-basic">
        <div id="admin-banner" style="display:none; background:#fff3cd; border:1.5px solid #ffc107; border-radius:8px; padding:10px 16px; margin-bottom:16px; font-size:14px; color:#7b5c00; align-items:center; gap:10px;">
            <span style="font-size:18px;">🛡️</span>
            <span>Admin กำลังแก้ไขข้อมูลสมาชิก: <strong id="admin-target-email"></strong></span>
            <button onclick="window.location.href='admin.html'" style="margin-left:auto; background:#8b7355; color:white; border:none; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px;">← กลับ Admin</button>
        </div>
        <h2 class="card-title">👤 ข้อมูลส่วนตัว</h2>
        <form onsubmit="saveBasicProfile(event)">
            <div class="profile-pic-wrap">
                <img id="profilePicPreview" src="https://placehold.co/110?text=User" alt="profile">
                <label for="profilePicUpload" class="btn-change-pic">📷 เปลี่ยนรูปโปรไฟล์</label>
                <input type="file" id="profilePicUpload" accept="image/*" style="display:none;" onchange="previewProfilePic(event)">
            </div>

            <div class="form-group">
                <label>อีเมล (ไม่สามารถเปลี่ยนได้)</label>
                <input type="email" id="userEmail" disabled>
            </div>
            <div class="form-row" style="display:flex;gap:12px;">
                <div class="form-group" style="flex:1;margin-bottom:0">
                    <label>ชื่อ <span style="color:red">*</span></label>
                    <input type="text" id="firstName" required placeholder="เช่น สมชาย">
                </div>
                <div class="form-group" style="flex:1;margin-bottom:0">
                    <label>นามสกุล <span style="color:red">*</span></label>
                    <input type="text" id="lastName" required placeholder="เช่น ใจดี">
                </div>
            </div>
            <div class="form-group" style="margin-top:18px">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="เช่น 0812345678">
            </div>

            <button type="submit" class="btn-submit">💾 บันทึกข้อมูลส่วนตัว</button>
        </form>
    </div>

    <!-- เปลี่ยนรหัสผ่าน -->
    <div class="card" id="section-password">
        <h2 class="card-title">🔒 เปลี่ยนรหัสผ่าน</h2>
        <form onsubmit="changePassword(event)">
            <div class="form-group">
                <label>รหัสผ่านเดิม</label>
                <input type="password" id="oldPassword" required placeholder="กรอกรหัสผ่านปัจจุบัน">
            </div>
            <div class="form-group">
                <label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="กำหนดรหัสผ่านใหม่">
            </div>
            <div class="form-group">
                <label>ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="กรอกซ้ำอีกครั้ง">
            </div>
            <button type="submit" class="btn-submit" style="background:#c0392b;">🔑 บันทึกรหัสผ่านใหม่</button>
        </form>
    </div>

</div>

<div class="custom-popup-overlay" id="customPopup">
    <div class="custom-popup-box">
        <div class="custom-popup-icon" id="popupIcon">ℹ️</div>
        <h3 class="custom-popup-title" id="popupTitle">แจ้งเตือน</h3>
        <p class="custom-popup-message" id="popupMessage"></p>
        <div class="custom-popup-buttons" id="popupButtons"></div>
    </div>
</div>

<script src="js/edit-profile.js"></script>
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
