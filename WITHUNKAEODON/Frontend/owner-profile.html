<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Icon.svg">
<title>ข้อมูลเจ้าของที่พัก - OakStay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="shared-header"></div>
<script src="js/shared-header.js"></script>

<!-- Popup -->
<div class="custom-popup-overlay" id="customPopup" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:none;justify-content:center;align-items:center;">
    <div style="background:#fff;padding:30px;border-radius:12px;text-align:center;max-width:400px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.2);">
        <div style="font-size:50px;margin-bottom:15px" id="popupIcon">ℹ️</div>
        <h3 style="font-size:20px;font-weight:600;margin:0 0 10px;color:#333;font-family:'Prompt',sans-serif" id="popupTitle">แจ้งเตือน</h3>
        <p style="font-size:15px;color:#666;margin-bottom:25px;line-height:1.5;font-family:'Prompt',sans-serif" id="popupMessage"></p>
        <div style="display:flex;justify-content:center;gap:10px" id="popupButtons"></div>
    </div>
</div>

<div class="layout-container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-profile">
            <img id="sideProfilePic" src="https://placehold.co/90?text=U" alt="profile">
            <h3 id="sideProfileName">กำลังโหลด...</h3>
            <p>เจ้าของที่พัก</p>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item" id="navInfo" onclick="switchTab('info')">
                <span class="nav-icon">👤</span> ข้อมูลส่วนตัว
            </div>
            <div class="nav-item active" id="navProperties" onclick="switchTab('properties')">
                <span class="nav-icon">🏠</span> ที่พักของเจ้าของ
                <span id="propCountBadge" style="margin-left:auto;background:#8b7355;color:white;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;display:none;"></span>
            </div>
            <div class="nav-item" id="sideChatBtn" onclick="startChat()">
                <span class="nav-icon">💬</span> ทักแชท
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Tab: ข้อมูลส่วนตัว -->
        <div id="tab-info" class="content-section" style="display:none;">
            <div class="section-header">
                <h1>👤 ข้อมูลส่วนตัว</h1>
                <button onclick="history.back()"
                    style="background:#f5f0e6;color:#8b7355;border:1px solid #dcd3c6;border-radius:8px;
                           padding:8px 16px;font-size:14px;cursor:pointer;font-family:'Prompt',sans-serif;">
                    ← ย้อนกลับ
                </button>
            </div>

            <div style="max-width:100%;">

                <!-- Profile Banner -->
                <div style="background:linear-gradient(135deg,#8b7355 0%,#6b523f 100%);border-radius:16px;padding:28px 28px 24px;margin-bottom:20px;position:relative;overflow:hidden;">
                    <div style="position:absolute;top:-30px;right:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.06);"></div>
                    <div style="position:absolute;bottom:-20px;right:60px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.04);"></div>
                    <div style="display:flex;align-items:center;gap:20px;position:relative;">
                        <img id="bannerPic" src="https://placehold.co/90?text=U"
                            style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.5);box-shadow:0 4px 16px rgba(0,0,0,0.2);flex-shrink:0;">
                        <div>
                            <div id="bannerName" style="font-weight:700;font-size:22px;color:white;margin-bottom:4px;">-</div>
                            <div id="bannerEmail" style="font-size:13px;color:rgba(255,255,255,0.75);">-</div>
                            <div style="margin-top:10px;">
                                <span style="background:rgba(255,255,255,0.15);color:white;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500;">เจ้าของที่พัก</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลทั่วไป -->
                <div style="background:white;border:1px solid #ece8e1;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(107,82,63,0.06);">
                    <div style="padding:12px 20px;background:#faf8f5;border-bottom:1px solid #f0ece6;font-size:11px;font-weight:700;color:#8b7355;text-transform:uppercase;letter-spacing:0.8px;">
                        📋 ข้อมูลทั่วไป
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;">
                        <span style="font-size:18px;width:32px;text-align:center;flex-shrink:0;">👤</span>
                        <div>
                            <div style="font-size:11px;color:#aaa;font-weight:500;margin-bottom:2px;">ชื่อ-นามสกุล</div>
                            <div id="dispName" style="font-size:15px;color:#3a3028;font-weight:500;">-</div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลติดต่อ -->
                <div style="background:white;border:1px solid #ece8e1;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(107,82,63,0.06);">
                    <div style="padding:12px 20px;background:#faf8f5;border-bottom:1px solid #f0ece6;font-size:11px;font-weight:700;color:#8b7355;text-transform:uppercase;letter-spacing:0.8px;">
                        📞 ข้อมูลติดต่อ
                    </div>

                    <!-- เบอร์โทร -->
                    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #f5f2ee;">
                        <span style="font-size:18px;width:32px;text-align:center;flex-shrink:0;">📞</span>
                        <div>
                            <div style="font-size:11px;color:#aaa;font-weight:500;margin-bottom:2px;">เบอร์โทรศัพท์</div>
                            <div id="dispPhone" style="font-size:15px;color:#3a3028;font-weight:500;">ยังไม่ได้ระบุ</div>
                        </div>
                    </div>

                    <!-- Line ID -->
                    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #f5f2ee;">
                        <span style="font-size:18px;width:32px;text-align:center;flex-shrink:0;">💬</span>
                        <div>
                            <div style="font-size:11px;color:#aaa;font-weight:500;margin-bottom:2px;">Line ID</div>
                            <div id="dispLine" style="font-size:15px;color:#06C755;font-weight:500;">ยังไม่ได้ระบุ</div>
                        </div>
                    </div>

                    <!-- Facebook -->
                    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;">
                        <span style="font-size:18px;width:32px;text-align:center;flex-shrink:0;">📘</span>
                        <div>
                            <div style="font-size:11px;color:#aaa;font-weight:500;margin-bottom:2px;">Facebook</div>
                            <div id="dispFacebook" style="font-size:15px;color:#1877F2;font-weight:500;">ยังไม่ได้ระบุ</div>
                        </div>
                    </div>
                </div>

                <!-- ปุ่มทักแชท -->
                <button id="chatBtn" onclick="startChat()"
                    style="width:100%;background:#28a745;color:white;border:none;border-radius:12px;
                           padding:14px;font-size:16px;font-weight:600;cursor:pointer;
                           font-family:'Prompt',sans-serif;display:flex;align-items:center;
                           justify-content:center;gap:8px;transition:0.2s;margin-top:4px;"
                    onmouseover="this.style.background='#1e7e34'"
                    onmouseout="this.style.background='#28a745'">
                    💬 ทักแชทเจ้าของ
                </button>

            </div>
        </div>

        <!-- Tab: ที่พักของเจ้าของ -->
        <div id="tab-properties" class="content-section active">
            <div class="section-header">
                <h1>🏠 ที่พักของเจ้าของ</h1>
                <button onclick="history.back()"
                    style="background:#f5f0e6;color:#8b7355;border:1px solid #dcd3c6;border-radius:8px;
                           padding:8px 16px;font-size:14px;cursor:pointer;font-family:'Prompt',sans-serif;">
                    ← ย้อนกลับ
                </button>
            </div>
            <div id="ownerPropertyGrid" class="property-grid">
                <p style="color:#aaa;padding:20px;">กำลังโหลด...</p>
            </div>
        </div>

    </main>
</div>

<script src="js/owner-profile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
